<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Planning roulement</title><style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f4f2;color:#111}
header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #ddd;padding:8px 12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
h1{font-size:16px;margin:0 12px 0 0}
.tab{border:1px solid #bbb;background:#fff;border-radius:6px;padding:7px 12px;font-size:14px;cursor:pointer}
.tab.on{background:#222;color:#fff;border-color:#222}
.sp{flex:1}
.btn{border:1px solid #888;background:#fff;border-radius:6px;padding:7px 12px;font-size:14px;cursor:pointer}
.btn:disabled{opacity:.4}
#status{font-size:12px;color:#555}
.wrap{overflow:auto;padding:8px 12px 140px}
table{border-collapse:separate;border-spacing:0}
th,td{border:1px solid #333;padding:0}
th{background:#fff;font-size:12px;padding:4px 6px;position:sticky;top:0;z-index:5}
th small{display:block;font-weight:normal;color:#555;font-size:10px}
td.name{position:sticky;left:0;z-index:4;background:#fff;font-weight:bold;font-size:12px;padding:0 8px;min-width:96px}
td.grp{background:#222;color:#fff;font-size:11px;padding:3px 8px;font-weight:bold;letter-spacing:.5px}
.cell{min-width:104px;height:38px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:11px;line-height:1.15;padding:2px 3px;cursor:pointer;user-select:none}
.cell.abs{color:#fff;font-weight:bold}
.cell.sel{outline:3px solid #0a58ff;outline-offset:-3px}
.cell.over{outline:3px dashed #0a58ff;outline-offset:-3px}
.cell.swapT:hover{outline:3px dashed #e67e00;outline-offset:-3px}
#panel{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:2px solid #222;padding:10px 12px;z-index:30;max-height:55vh;overflow:auto;display:none}
#panel.show{display:block}
#panel .t{font-size:14px;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{border:1px solid #333;border-radius:6px;padding:7px 10px;font-size:12px;cursor:pointer}
.row{display:flex;gap:8px;flex-wrap:wrap}
input.new{border:1px solid #888;border-radius:6px;padding:7px;font-size:14px;width:210px}
.ptitle{display:none}
@media print{*{-webkit-print-color-adjust:exact;print-color-adjust:exact}
header,#panel,.msg{display:none!important}body{background:#fff}.wrap{overflow:visible;padding:0}
.ptitle{display:block;font-size:14px;margin:0 0 6px}
.cell{min-width:0;height:28px;font-size:7.5px}td.name{font-size:8px;min-width:0;padding:0 4px}th{position:static;font-size:8px}td.name{position:static}
@page{size:landscape;margin:8mm}}
.msg{background:#fff3cd;border:1px solid #e0c36a;padding:8px 12px;font-size:13px;margin:8px 12px;border-radius:6px}

ER+ADAE"], "ISABELLE": ["MARIANNE", "BOX 1 B ADAE", "BOX 3", "POCHETTE COURRIER+ADAE", "L FAMILLE", "ADMIN", "ACC FAMILLE", "BOX 1 C COMEDEC", "ADAE", "COURRIER"], "JASMINA": ["ACC FAMILLE", "BOX 1 C COMEDEC", "ADAE", "COURRIER", "ACCUEIL", "BOITE MAIL", "MENTIONS", "BOX 1 D ADAE", "BOX 1 B ADAE", "MARIANNE"], "NASSER": ["MENTIONS", "BOX 1 D ADAE", "BOX 1 B ADAE", "MARIANNE", "POCHETTE COURRIER+ADAE", "BOX 3", "ADMIN", "L FAMILLE", "BOX 1 C COMEDEC", "ACC FAMILLE"], "NICOLE": ["ADMIN", "L FAMILLE", "BOX 1 C COMEDEC", "ACC FAMILLE", "COURRIER", "ADAE", "BOITE MAIL", "ACCUEIL", "BOX 1 D ADAE", "MENTIONS"], "PATRICIA": ["BOITE MAIL", "ACCUEIL", "BOX 1 D ADAE", "MENTIONS", "MARIANNE", "BOX 1 B ADAE", "BOX 3", "POCHETTE COURRIER+ADAE", "L FAMILLE", "ADMIN"], "GABY": ["ADAE", "C.CONTACT", "ACCUEIL", "ADAE", "COMEDEC", "ACCUEIL", "C.CONTACT", "COMEDEC", "ADAE", "C.CONTACT"], "MARIA": ["ACCUEIL", "ADAE", "COMEDEC", "ACCUEIL", "C.CONTACT", "COMEDEC", "ADAE", "C.CONTACT", "ACCUEIL", "ADAE"], "SÉBASTIEN": ["COMEDEC", "ACCUEIL", "C.CONTACT", "COMEDEC", "ADAE", "C.CONTACT", "ACCUEIL", "ADAE", "COMEDEC", "ACCUEIL"]}}], "postes": ["ABSENCE", "ACC FAMILLE", "ACCUEIL", "ADAE", "ADMIN", "AG", "AUDITION", "BOITE MAIL", "BOX 1 A MAIL", "BOX 1 B ADAE", "BOX 1 B COMEDEC", "BOX 1 C COMEDEC", "BOX 1 C MAIL", "BOX 1 D ADAE", "BOX 1 D COMEDEC", "BOX 2", "BOX 3", "BOX 4", "C.CONTACT", "COMEDEC", "COURRIER", "DOSSIERS", "L FAMILLE", "MARIANNE", "MENTIONS", "NCES EXT / PUBS / T° DC", "POCHETTE COURRIER+ADAE", "PREPA MARIAGES", "VERIF MGES + LISTE+PUBS"], "undo": []}</script><script id="app">
const state=JSON.parse(document.getElementById('state').textContent);
const KEY='planning-roulement-v1';
try{const o=localStorage.getItem(KEY);if(o){const p=JSON.parse(o);if(p&&p.weeks&&p.groups&&p.postes)Object.assign(state,p);}}catch(e){}
state.groups.forEach(g=>{if(g.name==='Volants')g.name='Polyvalent';});
const CSS=document.querySelector('style').textContent;
const CODE=document.getElementById('app').textContent;
const DAYS=['Lun','Mar','Mer','Jeu','Ven'];
function col(t){const u=t.toUpperCase();
 if(u==='ABSENCE')return '#e00000';
 if(u.indexOf('BOX 1')===0)return '#ffff00';
 if(u.indexOf('BOX')===0)return '#ffffff';
 if(u.indexOf('MENTIONS')>=0)return '#ff33cc';
 if(u==='COMEDEC')return '#4f9bd9';
 if(u.indexOf('BOITE MAIL')>=0)return '#f5a623';
 if(u.indexOf('L FAMILLE')>=0)return '#a9d18e';
 if(u==='AG')return '#00b050';
 if(u==='ADMIN')return '#ffffff';
 if(u.indexOf('AUDITION')>=0)return '#9966cc';
 if(u.indexOf('DOSSIERS')>=0)return '#f4e4bc';
 if(u.indexOf('VERIF')>=0||u.indexOf('PREPA')>=0)return '#e9a8f2';
 if(u.indexOf('NCES')>=0)return '#f4b183';
 if(u.indexOf('ACCUEIL')>=0)return '#00b0f0';
 if(u.indexOf('C.CONTACT')>=0)return '#f5a623';
 return '#b4c7e7';}
let cur=(location.hash||'').replace('#','');
if(!state.weeks.some(w=>w.id===cur))cur=state.weeks[0].id;
let teamOpen=false,delArm=null;
let sel=null,mode='idle',picker=false,cap=null,timer=null,dirty=false,canSave=true,saved='';
const root=document.getElementById('root');
function wk(){return state.weeks.find(w=>w.id===cur);}
function fmt(iso,d){const x=new Date(iso+'T12:00:00');x.setDate(x.getDate()+d);return String(x.getDate()).padStart(2,'0')+'/'+String(x.getMonth()+1).padStart(2,'0');}
function slotName(i){return DAYS[Math.floor(i/2)]+(i%2?' après-midi':' matin');}
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e;}
function render(){
 root.textContent='';
 const h=el('header');h.appendChild(el('h1',null,'Planning roulement'));
 state.weeks.forEach(w=>{const b=el('button','tab'+(w.id===cur?' on':''),w.label+' · '+fmt(w.mon,0));b.onclick=()=>{cur=w.id;location.hash=w.id;sel=null;mode='idle';picker=false;render();};h.appendChild(b);});
 const pr=el('button','btn','🖨 PDF');pr.onclick=()=>window.print();h.appendChild(pr);
 const sh=el('button','btn','📤 Envoyer l\'image');sh.onclick=shareImg;h.appendChild(sh);
 const tm=el('button','btn','👥 Équipe');tm.onclick=()=>{teamOpen=!teamOpen;delArm=null;sel=null;render();};h.appendChild(tm);
 const ad=el('button','btn','+ Semaine');ad.onclick=addWeek;h.appendChild(ad);
 h.appendChild(el('div','sp'));
 const u=el('button','btn','↶ Annuler');u.disabled=!state.undo.length;u.onclick=undo;h.appendChild(u);
 const s=el('span',null,'');s.id='status';s.textContent=!canSave?'Lecture seule : modifications non enregistrées':(dirty?'Enregistrement…':saved);h.appendChild(s);
 root.appendChild(h);
 if(!canSave)root.appendChild(el('div','msg','Tu peux modifier, mais ce lien est en lecture seule : les changements seront perdus à la fermeture. Demande un accès en modification.'));
 const wrap=el('div','wrap');wrap.appendChild(el('h2','ptitle','Planning · '+wk().label+' · du '+fmt(wk().mon,0)+' au '+fmt(wk().mon,4)));const t=document.createElement('table');
 const hr=document.createElement('tr');hr.appendChild(el('th',null,''));
 for(let d=0;d<5;d++){const th=el('th',null,DAYS[d]+' '+fmt(wk().mon,d));th.colSpan=2;hr.appendChild(th);}
 t.appendChild(hr);
 const hr2=document.createElement('tr');hr2.appendChild(el('th',null,''));hr2.firstChild.style.top='24px';
 for(let i=0;i<10;i++){const th=el('th',null,i%2?'Après-midi':'Matin');th.style.top='24px';th.style.fontWeight='normal';hr2.appendChild(th);}
 t.appendChild(hr2);
 state.groups.forEach(g=>{
  const gr=document.createElement('tr');const gc=el('td','grp',g.name.toUpperCase());gc.colSpan=11;gr.appendChild(gc);t.appendChild(gr);
  sm(g).forEach(n=>{
   const tr=document.createElement('tr');tr.appendChild(el('td','name',n.replace(' 50%','')));
   (wk().grid[n]||[]).forEach((p,i)=>{
    const td=document.createElement('td');td.style.background=col(p);
    const c=el('div','cell'+(p==='ABSENCE'?' abs':'')+(sel&&sel.n===n&&sel.i===i?' sel':'')+(mode==='swap'?' swapT':''),p);
    c.draggable=true;
    c.ondragstart=e=>{e.dataTransfer.setData('text/plain',n+'|'+i);e.dataTransfer.effectAllowed='move';};
    c.ondragover=e=>{e.preventDefault();c.classList.add('over');};
    c.ondragleave=()=>c.classList.remove('over');
    c.ondrop=e=>{e.preventDefault();c.classList.remove('over');const [n2,i2]=e.dataTransfer.getData('text/plain').split('|');swap({n:n2,i:+i2},{n:n,i:i});};
    c.onclick=()=>tap(n,i);
    td.appendChild(c);tr.appendChild(td);});
   t.appendChild(tr);});
 });
 wrap.appendChild(t);root.appendChild(wrap);
 const pn=el('div','');pn.id='panel';root.appendChild(pn);renderPanel();
}
function renderPanel(){
 const pn=document.getElementById('panel');pn.textContent='';
 if(teamOpen){pn.className='show';pn.appendChild(el('div','t','Équipe : touche un nom pour le retirer (2 touches pour confirmer), ou ajoute un nouvel agent. Tous les plannings sont mis à jour.'));
  state.groups.forEach(g=>{const gh=el('div','t',g.name.toUpperCase());gh.style.margin='8px 0 0';gh.style.fontWeight='bold';pn.appendChild(gh);
   const chips=el('div','chips');chips.style.marginTop='4px';
   sm(g).forEach(n=>{const lab=n.replace(' 50%','');const x=el('div','chip',delArm===n?'Retirer '+lab+' ? Touche pour confirmer':lab+' ✕');x.style.background=delArm===n?'#ffd6d6':'#fff';
    x.onclick=()=>{if(delArm===n){removeAgent(n);}else{delArm=n;renderPanel();}};chips.appendChild(x);});
   pn.appendChild(chips);});
  const r=el('div','row');r.style.marginTop='10px';
  const inp=document.createElement('input');inp.className='new';inp.placeholder='Nom du nouvel agent';r.appendChild(inp);
  const sl=document.createElement('select');sl.className='new';state.groups.forEach(g=>{const o=document.createElement('option');o.value=g.name;o.textContent=g.name;sl.appendChild(o);});r.appendChild(sl);
  const ok=el('button','btn','Ajouter');ok.onclick=()=>{addAgent(inp.value,sl.value);};r.appendChild(ok);
  const cl=el('button','btn','Fermer');cl.onclick=()=>{teamOpen=false;delArm=null;render();};r.appendChild(cl);
  pn.appendChild(r);return;}
 if(!sel){pn.className='';return;}
 pn.className='show';
 const cell=wk().grid[sel.n][sel.i];
 pn.appendChild(el('div','t',sel.n.replace(' 50%','')+' · '+slotName(sel.i)+' · '+cell));
 if(mode==='swap'){pn.appendChild(el('div','t','Touche la case avec laquelle échanger (ou glisse-dépose directement).'));
  const b=el('button','btn','Annuler l\'échange');b.onclick=()=>{mode='idle';render();};pn.appendChild(b);return;}
 const row=el('div','row');
 const a=el('button','btn','Remplacer le poste');a.onclick=()=>{picker=!picker;renderPanel();};row.appendChild(a);
 const b=el('button','btn','⇄ Échanger avec une autre case');b.onclick=()=>{mode='swap';render();};row.appendChild(b);
 const c=el('button','btn','Mettre ABSENCE');c.onclick=()=>setCell(sel.n,sel.i,'ABSENCE');row.appendChild(c);
 const d=el('button','btn','Fermer');d.onclick=()=>{sel=null;picker=false;render();};row.appendChild(d);
 pn.appendChild(row);
 if(picker){
  const chips=el('div','chips');
  state.postes.forEach(p=>{const x=el('div','chip',p);x.style.background=col(p);if(p==='ABSENCE')x.style.color='#fff';x.onclick=()=>setCell(sel.n,sel.i,p);chips.appendChild(x);});
  pn.appendChild(chips);
  const r=el('div','row');r.style.marginTop='10px';
  const inp=document.createElement('input');inp.className='new';inp.placeholder='Nouveau poste…';r.appendChild(inp);
  const ok=el('button','btn','Ajouter et utiliser');ok.onclick=()=>{const v=inp.value.trim().toUpperCase();if(!v)return;if(state.postes.indexOf(v)<0)state.postes.push(v);setCell(sel.n,sel.i,v);};r.appendChild(ok);
  pn.appendChild(r);}
}
function tap(n,i){
 if(mode==='swap'&&sel){if(sel.n===n&&sel.i===i){mode='idle';render();return;}swap(sel,{n:n,i:i});return;}
 sel={n:n,i:i};picker=false;mode='idle';render();
}
function addWeek(){const last=state.weeks[state.weeks.length-1];const d=new Date(last.mon+'T12:00:00');d.setDate(d.getDate()+7);
 const mon=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
 const g={};Object.keys(last.grid).forEach(n=>{g[n]=last.grid[n].slice();});
 const id='s'+mon;state.weeks.push({id:id,label:'Sem. '+isoWeek(d),mon:mon,grid:g});cur=id;location.hash=id;sel=null;dirty=true;render();clearTimeout(timer);timer=setTimeout(save,900);}
function isoWeek(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const n=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-n);const y=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y)/86400000+1)/7);}
function drawImg(){
 const CW=132,CH=44,NW=120,HH=30,GH=26,T=44,P=14;
 const rows=[];state.groups.forEach(g=>{rows.push({g:g.name});sm(g).forEach(n=>rows.push({n:n}));});
 const W=P*2+NW+CW*10,H=P*2+T+HH*2+rows.reduce((a,r)=>a+(r.g?GH:CH),0);
 const sc=2,cv=document.createElement('canvas');cv.width=W*sc;cv.height=H*sc;
 const c=cv.getContext('2d');c.scale(sc,sc);c.fillStyle='#fff';c.fillRect(0,0,W,H);
 c.textAlign='center';c.textBaseline='middle';c.fillStyle='#111';c.font='bold 20px Arial';c.textAlign='left';
 c.fillText('Planning · '+wk().label+' · du '+fmt(wk().mon,0)+' au '+fmt(wk().mon,4),P,P+T/2);c.textAlign='center';
 let y=P+T;const x0=P+NW;
 c.strokeStyle='#333';c.lineWidth=1;
 for(let d=0;d<5;d++){c.fillStyle='#fff';c.fillRect(x0+d*CW*2,y,CW*2,HH);c.strokeRect(x0+d*CW*2,y,CW*2,HH);c.fillStyle='#111';c.font='bold 13px Arial';c.fillText(DAYS[d]+' '+fmt(wk().mon,d),x0+d*CW*2+CW,y+HH/2);}
 y+=HH;
 for(let i=0;i<10;i++){c.fillStyle='#fff';c.fillRect(x0+i*CW,y,CW,HH);c.strokeRect(x0+i*CW,y,CW,HH);c.fillStyle='#444';c.font='11px Arial';c.fillText(i%2?'Après-midi':'Matin',x0+i*CW+CW/2,y+HH/2);}
 y+=HH;
 rows.forEach(r=>{
  if(r.g){c.fillStyle='#222';c.fillRect(P,y,NW+CW*10,GH);c.fillStyle='#fff';c.font='bold 12px Arial';c.textAlign='left';c.fillText(r.g.toUpperCase(),P+8,y+GH/2);c.textAlign='center';y+=GH;return;}
  c.fillStyle='#fff';c.fillRect(P,y,NW,CH);c.strokeRect(P,y,NW,CH);c.fillStyle='#111';c.font='bold 13px Arial';c.textAlign='left';c.fillText(r.n.replace(' 50%',''),P+8,y+CH/2);c.textAlign='center';
  (wk().grid[r.n]||[]).forEach((p,i)=>{
   const x=x0+i*CW;c.fillStyle=col(p);c.fillRect(x,y,CW,CH);c.strokeRect(x,y,CW,CH);
   c.fillStyle=p==='ABSENCE'?'#fff':'#111';c.font=(p==='ABSENCE'?'bold ':'')+'12px Arial';
   const words=p.split(' ');let lines=[],l='';words.forEach(w=>{const t=l?l+' '+w:w;if(c.measureText(t).width>CW-10&&l){lines.push(l);l=w;}else l=t;});lines.push(l);
   lines=lines.slice(0,3);const lh=13,y0=y+CH/2-(lines.length-1)*lh/2;lines.forEach((t,k)=>c.fillText(t,x+CW/2,y0+k*lh));});
  y+=CH;});
 return cv;}
function shareImg(){
 const cv=drawImg();const name='planning-'+wk().label.replace(/[^a-z0-9]+/gi,'-')+'.png';
 cv.toBlob(async b=>{
  try{const f=new File([b],name,{type:'image/png'});
   if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Planning '+wk().label});return;}}catch(e){if(e&&e.name==='AbortError')return;}
  const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>{window.open(u,'_blank');},300);
 },'image/png');}
function addAgent(name,gname){name=name.trim().toUpperCase();if(!name)return;if(state.groups.some(g=>g.members.indexOf(name)>=0))return;
 const g=state.groups.find(x=>x.name===gname);if(!g)return;g.members.push(name);state.weeks.forEach(w=>{w.grid[name]=Array(10).fill('ABSENCE');});
 dirty=true;render();clearTimeout(timer);timer=setTimeout(save,900);}
function removeAgent(n){state.groups.forEach(g=>{g.members=g.members.filter(m=>m!==n);});state.weeks.forEach(w=>{delete w.grid[n];});
 state.undo=[];delArm=null;dirty=true;render();clearTimeout(timer);timer=setTimeout(save,900);}
function sm(g){return g.members.slice().sort((a,b)=>a.replace(' 50%','').localeCompare(b.replace(' 50%',''),'fr'));}
function pushUndo(changes){state.undo.push({w:cur,c:changes});if(state.undo.length>30)state.undo.shift();}
function setCell(n,i,v){const g=wk().grid[n];if(g[i]===v){return;}pushUndo([{n:n,i:i,v:g[i]}]);g[i]=v;after();}
function swap(a,b){const g=wk().grid;if(a.n===b.n&&a.i===b.i)return;const va=g[a.n][a.i],vb=g[b.n][b.i];
 pushUndo([{n:a.n,i:a.i,v:va},{n:b.n,i:b.i,v:vb}]);g[a.n][a.i]=vb;g[b.n][b.i]=va;after();}
function undo(){const u=state.undo.pop();if(!u)return;const w=state.weeks.find(x=>x.id===u.w);u.c.forEach(c=>{w.grid[c.n][c.i]=c.v;});after(true);}
function after(){sel=null;mode='idle';picker=false;dirty=true;render();clearTimeout(timer);timer=setTimeout(save,900);}
function esc(s){return s.replace(/</g,'\\u003c');}
function buildHtml(){
 return '<!DOCTYPE html>\n<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Planning roulement</title><style>'+CSS+'</style></head><body><div id="root"></div><script id="state" type="application/json">'+esc(JSON.stringify(state))+'<\/script><script id="app">'+CODE+'<\/script></body></html>';
}
function save(){
 try{localStorage.setItem(KEY,JSON.stringify(state));saved='Enregistré ✓';}catch(e){saved='Enregistrement impossible';}
 dirty=false;render();
}
render();
</script></body></html>
